<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Blessed Company</title>
    <style>
      /* iOS Safari enlarges text in landscape unless told not to. */
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      /* The page itself must never scroll: on iOS a scrolled page draws fixed elements in one place but hit-tests taps in another,
         so Temple buttons took taps offset from where they showed (Nov 19). 100vh is taller than the visible area in iOS landscape,
         which is what let the page scroll; size to the fixed body instead. */
      html, body { margin: 0; height: 100%; background: #12101a; overflow: hidden; touch-action: none; overscroll-behavior: none; }
      body { position: fixed; inset: 0; }
      #game { width: 100%; height: 100%; }
      #ui-root { position: fixed; inset: 0; pointer-events: none; }
      #ui-root > * { pointer-events: auto; }
      #rotate { display: none; position: fixed; inset: 0; z-index: 50; background: #0b090d; color: #f4efe4; font: 600 20px system-ui, sans-serif;
        align-items: center; justify-content: center; text-align: center; padding: 24px; }
      @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui-root"></div>
    <div id="rotate">Turn your phone sideways to play.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
